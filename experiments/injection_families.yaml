description: >
  App. Other Model Families. Fig. 3 on Llama-3.1-8B, Gemma-3-12B and Apertus-8B, each with the
  direction extracted from its own base model.
grids:
  - models: [llama8b, gemma12b, apertus8b]
    conditions: [base]
    tasks:
      - steer: {direction: stereotype, multipliers: [-3, -2, -1.5, -1, -0.5, 0, 1, 2, 3]}
      - steer: {direction: random, multipliers: [-2, -1, 0, 1, 2]}
  - models: [llama8b, gemma12b, apertus8b]
    conditions: [gender-stereotype, race-stereotype]
    seeds: [42, 43, 44]
    tasks:
      - steer: {direction: stereotype, multipliers: [-3, -2, -1.5, -1, -0.5, 0, 1]}
      - steer: {direction: random, multipliers: [-2, -1.5, -1, -0.5, 0]}
